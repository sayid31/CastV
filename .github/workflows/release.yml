name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag yang akan dirilis (contoh: v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: meta
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $env:INPUT_TAG
          } else {
            $env:GITHUB_REF_NAME
          }
          if (-not $tag) { throw 'Tag tidak ditemukan.' }
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Format tag tidak valid: $tag (harus vMAJOR.MINOR.PATCH)"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Sync version from tag
        shell: pwsh
        run: npm version ${{ steps.meta.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        # --publish never: we publish through `gh` below so the asset names
        # and release notes stay under our control.
        run: npm run dist -- --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Verify built files
        shell: pwsh
        run: |
          $expected = @(
            "release/CastV-${{ steps.meta.outputs.version }}-x64.exe",
            "release/CastV-${{ steps.meta.outputs.version }}-portable.exe",
            "release/CastV-${{ steps.meta.outputs.version }}-x64.exe.blockmap"
          )
          $missing = $expected | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Error "File installer tidak ditemukan: $($missing -join ', ')"
            exit 1
          }
          $expected | ForEach-Object {
            $mb = [math]::Round((Get-Item $_).Length / 1MB, 1)
            Write-Output "  $_ ($mb MB)"
          }

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          $notes = @"
          ## CastV $env:TAG

          ### Download untuk Windows

          - **Installer (NSIS)** - https://github.com/$env:REPO/releases/latest/download/CastV-latest-x64.exe
          - **Portable** (tanpa instalasi) - https://github.com/$env:REPO/releases/latest/download/CastV-latest-portable.exe

          ### Catatan

          - Windows 10/11 x64
          - Installer belum code-signed, jadi Windows SmartScreen bisa menampilkan peringatan. Pilih **More info -> Run anyway**.
          - Jalur AirPlay mengirim video HLS dengan delay beberapa detik. Jalur browser memakai WebRTC.
          "@

          # Skip if a release for this tag already exists (re-run on same tag).
          $existing = gh api "repos/$env:REPO/releases/tags/$env:TAG" --silent 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release untuk $env:TAG sudah ada, Made reuse."
            gh release edit $env:TAG --title "CastV $env:TAG" --notes $notes
          } else {
            gh release create $env:TAG --title "CastV $env:TAG" --notes $notes --verify-tag
            if ($LASTEXITCODE -ne 0) { throw "Gagal membuat release $env:TAG" }
          }
          "Release $env:TAG siap."

      - name: Upload assets (stable names)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          $releaseId = gh api "repos/$env:REPO/releases/tags/$env:TAG" --jq .id
          if (-not $releaseId) { throw "Release id tidak ditemukan untuk $env:TAG" }

          # Asset names intentionally carry no version number, so the landing
          # page URL `releases/latest/download/CastV-latest-x64.exe` keeps
          # working forever - no redeploy needed on every release.
          $assets = @(
            @{ src = "release/CastV-$env:VERSION-x64.exe";         name = "CastV-latest-x64.exe" }
            @{ src = "release/CastV-$env:VERSION-portable.exe";    name = "CastV-latest-portable.exe" }
            @{ src = "release/CastV-$env:VERSION-x64.exe.blockmap"; name = "CastV-latest-x64.exe.blockmap" }
          )

          foreach ($a in $assets) {
            if (-not (Test-Path $a.src)) { throw "File tidak ada: $($a.src)" }
            Write-Output "Mengupload $($a.name)..."
            gh api --method POST `
              -H "Content-Type: application/octet-stream" `
              --input $a.src `
              "repos/$env:REPO/releases/$releaseId/assets?name=$($a.name)" `
              --silent
            if ($LASTEXITCODE -ne 0) { throw "Gagal mengupload $($a.src)" }
            $mb = [math]::Round((Get-Item $a.src).Length / 1MB, 1)
            Write-Output "  OK $($a.name) ($mb MB)"
          }

      - name: Summarise
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh api "repos/$env:REPO/releases/tags/$env:TAG" --jq '.html_url, (.assets[] | "  \(.name)  \(.size / 1048576 | floor) MB")'

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: castv-${{ steps.meta.outputs.version }}
          path: |
            release/*.exe
            release/*.blockmap
          retention-days: 30
          if-no-files-found: error
